[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = ".next"
  environment = { SECRETS_SCAN_OMIT_PATHS = "*.md,next.config.js,src/app/admin/**" }

[context.production]
  command = "npm install --legacy-peer-deps && npm run build"
  environment = { SECRETS_SCAN_OMIT_PATHS = "*.md,next.config.js,src/app/admin/**" }

[context.deploy-preview]
  command = "npm install --legacy-peer-deps && npm run build"
  environment = { SECRETS_SCAN_OMIT_PATHS = "*.md,next.config.js,src/app/admin/**" }